<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание - Онлайн book</title>
  <style>
    :root { --bg: #0a0a0c; --text-main: #ffffff; --text-muted: #9ba1a6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg); color: var(--text-main); padding: 20px; min-height: 100vh; }
    .container { width: 100%; max-width: 600px; margin: 0 auto; }
    .back-btn { display: inline-block; text-decoration: none; color: var(--text-muted); font-size: 16px; font-weight: 600; margin-bottom: 30px; padding: 10px 0; }
    h1 { font-size: 28px; font-weight: 900; margin-bottom: 20px; color: #4a90d9; }
    .task-content { background: #1c1c1e; padding: 24px; border-radius: 16px; border: 1px solid #333; font-size: 18px; line-height: 1.6; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <a href="algebra.html" class="back-btn">← Назад к номерам</a>
    <h1 id="task-title">Задание</h1>
    <div class="task-content" id="task-text">Загрузка...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const taskId = urlParams.get('id');

    const tasksData = {
      "141": "Установить, какое из двух уравнений является следствием другого уравнения:\n1) x - 3 = 0  и  x² - 5x + 6 = 0;\n2) (x² - 3x + 2) / (x - 1) = 0  и  x² - 3x + 2 = 0.",
      "142": "Решить уравнение:\n1) x/(x+1) + 2x/(x-1) = 4x/(x²-1);\n2) (x-1)/(x-2) - 2/x = 1/(x-2);\n3) (x-3)(x-5) = 3(x-5);\n4) (x-2)(x²+1) = 2(x²+1).",
      "143": "Решить неравенство:\n1) (x+3)/(2+x²) < 3;\n2) (x-2)/(5-x) > 1.",
      "144": "Выяснить, равносильны ли уравнения:\n1) |2x - 1| = 3  и  2x - 1 = 3;\n2) (3x-2)/3 - (4-x)/2 - (3x-5)/6 = 2x - 2  и  2x + 3 = 10/3.",
      "145": "Выяснить, равносильны ли уравнения:\n1) 2x - 1 = 4 - 1,5x  и  3,5x - 5 = 0;\n2) x(x-1) = 2x + 5  и  x² - 3x - 5 = 0;\n3) 2^(3x+1) = 2^(-3)  и  3x + 1 = -3;\n4) √(x+2) = 3  и  x + 2 = 9.",
      "146": "Установить, какое из двух уравнений является следствием другого уравнения:\n1) |x| = √5  и  √(x²) = 5;\n2) (x-2)/(x+3) = (x-3)/(x+2)  и  (x-2)(x+2) = (x-3)(x+3).",
      "147": "Решить уравнение:\n1/(3x+1) - 2/(3x-1) - 5x/(9x²-1) = 3x²/(1-9x²).",
      "148": "Найти корни уравнения:\n1) 3/(x-1) - (4x-1)/(x+1) = (x²+5)/(x²-1) - 5;\n2) (x+2)/(x-2) - x(x-4)/(x²-4) = (x-2)/(x+2) - 4(3+x)/(4-x²).",
      "149": "Решить неравенство:\n1) x³ - 3x² + 2x - 6 > 2x³ - x² + 4x - 2;\n2) x³ - 3x² - 4x + 12 > -3x³ + x² + 12x - 4.",
      "150": "Доказать, что если каждая из функций f(x), g(x) и φ(x) определена на множестве X и φ(x) ≠ 0 для всех x ∈ X, то уравнения f(x) = g(x) и f(x)·φ(x) = g(x)·φ(x) равносильны.",
      "151": "(Устно.) Решить уравнение:\n1) √x = 2;\n2) √x = 7;\n3) ³√x = 2;\n4) ³√x = -3;\n5) ³√(1-3x) = 0;\n6) ⁴√x = 1;\n7) ⁴√(2-x) = 0.",
      "152": "Решить уравнение:\n1) √(x+1) = 3;\n2) √(x-2) = 5;\n3) √(4+x) = √(2x-1)."
    };

    const titleEl = document.getElementById('task-title');
    const textEl = document.getElementById('task-text');

    if (taskId && tasksData[taskId]) {
      titleEl.textContent = "Задание №" + taskId;
      textEl.textContent = tasksData[taskId];
    } else {
      titleEl.textContent = "Ошибка";
      textEl.textContent = "Задание не найдено. Вернитесь назад.";
    }
  </script>
</body>
</html>
